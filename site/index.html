<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>提椠 Registry</title>
		<meta name="description" content="提椠的软件包仓库。" />
		<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
		<!--
			字体都放在自己这里（assets/fonts/），不走外部 CDN：
			与官网同款的 Inter（西文）、MiSans（汉字）；卡片用 JetBrains Mono；
			分组标题用 Roboto Flex 的静态实例（wdth 80、wght 700，其余轴默认），
			其中的汉字用文渊黑体 wdth 87.5、wght 600 的子集（Registry Label SC，由 site/subset-label-font.py 生成）。
		-->
		<link rel="stylesheet" href="/assets/fonts/inter/inter.css" />
		<link rel="stylesheet" href="/assets/fonts/jetbrains-mono/jetbrains-mono.css" />
		<link rel="stylesheet" href="/assets/fonts/misans/MiSans-Regular.min.css" />
		<link rel="stylesheet" href="/assets/fonts/misans/MiSans-Semibold.min.css" />
		<!-- 详情页大卡片右下角「版本、源码、协议」用的 MiSans Medium 子集（site/misans-medium.py） -->
		<link rel="stylesheet" href="/assets/fonts/misans-medium/misans-medium.css" />
		<link rel="stylesheet" href="/assets/fonts/roboto-flex/roboto-flex.css" />
		<link rel="stylesheet" href="/assets/fonts/registry-label-sc/registry-label-sc.css" />
		<!-- 提椠排的说明文字用的 Inter 静态实例（构建期预排不支持可变字体，见 site/static-inter.py） -->
		<link rel="stylesheet" href="/assets/fonts/inter-static/inter-static.css" />
		<link rel="stylesheet" href="/assets/style.css" />
		<!-- 详情页：提椠构建期预排的数据，由 site/build.mjs 填入 -->
<!-- head -->
	</head>
	<body>
		<header class="site-header">
			<div class="site-header__inner frame">
				<div class="header-brand">
					<a class="brand" href="/" aria-label="提椠 Registry">
						<!-- 标志和「提椠」实色；「Registry」两层混合（见 style.css 的 .ink-blend） -->
						<span class="brand__logo" aria-hidden="true">
							<span class="ink-svg" style="--ink-svg-src: url('/assets/registry-mark.svg')"></span>
							<span class="ink-blend brand__word" style="--ink-svg-src: url('/assets/registry-word.svg')"><span class="ink-svg ink-blend__overlay"></span><span class="ink-svg ink-blend__base"></span></span>
						</span>
					</a>
					<a class="powered-link" href="https://github.com/Losses/boring" aria-label="Powered by Boring Platform">
						<span class="ink-blend powered" aria-hidden="true"><span class="ink-svg ink-blend__overlay"></span><span class="ink-svg ink-blend__base"></span></span>
					</a>
				</div>
				<form class="search" role="search" onsubmit="return false">
					<input type="search" aria-label="搜索" autocomplete="off" />
					<!-- Material Symbols「search」：Outlined，字重 400、grade 0、opsz 24，不填充（Apache-2.0） -->
					<svg viewBox="0 -960 960 960" aria-hidden="true">
						<path fill="currentColor" d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
					</svg>
					<!--
						搜索结果：搜索框下面弹出来的一块，聚焦时显示（见 style.css 的 .search__panel）。
						没有脚本时只有下面这句提示；有脚本时 search.js 把提示换成结果列表
					-->
					<div class="search__panel">
						<p class="search__hint">搜索需要开启 JavaScript。</p>
						<ul class="search__results" id="search-results" role="listbox" aria-label="搜索结果" hidden></ul>
					</div>
				</form>
			</div>
		</header>

		<!-- 主体：首页是分组卡片，详情页是单张卡片的包列表，由 site/build.mjs 填入 -->
<!-- main -->

		<footer class="site-footer">
			<nav class="site-footer__navigation" aria-label="页脚导航">
				<div class="site-footer__columns">
					<div class="site-footer__column">
						<div class="site-footer__brand" data-footer-item="0">
							<a href="https://tiqian.org/" aria-label="提椠首页">
								<span class="ink-svg" style="--ink-svg-src: url('/assets/brand.svg')" aria-hidden="true"></span>
							</a>
						</div>
					</div>
					<div class="site-footer__column">
						<section class="site-footer__group" data-footer-item="1">
							<h2>文档</h2>
							<ul>
								<li>什么是提椠</li>
								<li>如何接入</li>
								<li>RFC</li>
								<li>ADR</li>
							</ul>
						</section>
					</div>
					<div class="site-footer__column">
						<section class="site-footer__group" data-footer-item="2">
							<h2>仓库</h2>
							<ul>
								<li><a href="https://github.com/tiqian-cjk/tiqian">提椠</a></li>
								<li><a href="https://github.com/tiqian-cjk/tiqian-rs">提椠 Rust</a></li>
								<li><a href="https://github.com/tiqian-cjk/tiqian-markdown">提椠 Markdown</a></li>
								<li><a href="https://github.com/tiqian-cjk/tiqian-math">提椠 Math</a></li>
								<li><a href="https://github.com/tiqian-cjk/pageflow">Pageflow</a></li>
							</ul>
						</section>
					</div>
					<div class="site-footer__column">
						<section class="site-footer__group" data-footer-item="3">
							<h2>发布</h2>
							<ul>
								<li><a href="/">提椠 Registry</a></li>
								<li><a href="https://mvnrepository.com/artifact/org.tiqian">Maven Central</a></li>
								<li><a href="https://www.npmjs.com/org/tiqian">NPM</a></li>
								<li><a href="https://crates.io/crates/tiqian">Cargo</a></li>
							</ul>
						</section>
					</div>
					<div class="site-footer__column">
						<section class="site-footer__group" data-footer-item="4">
							<h2>关于</h2>
							<ul>
								<li>联系我们</li>
							</ul>
						</section>
					</div>
				</div>
			</nav>

			<div class="site-footer__wordmark-frame">
				<!-- 纯装饰：品牌名已由页眉与页脚标志提供，读屏跳过 -->
				<span class="ink-svg" style="--ink-svg-src: url('/assets/wordmark-serif.svg')" aria-hidden="true"></span>
			</div>
		</footer>

		<script src="/assets/footer.js"></script>
		<script src="/assets/snippet.js"></script>
		<script src="/assets/back.js"></script>
		<script src="/assets/versions.js"></script>
		<script src="/assets/search.js"></script>
		<!-- 提椠排版（构建时打包到 /assets/tiqian/，见 site/vite.config.mjs）：页面上有 <tiqian-prose> 才加载 -->
		<script type="module">
			if (document.querySelector('tiqian-prose')) import('/assets/tiqian/tiqian.js').catch(() => {});
		</script>
	</body>
</html>
